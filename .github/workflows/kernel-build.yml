name: kernel-build
# Kleinia kernel CI — fully native on the self-hosted runner.
# Produces OCI artifacts for kernel + kernel-devel, published to
# zot (internal) and ghcr (public) with sequenced tags, signed
# with the project cosign key.
on:
  workflow_dispatch:
    inputs:
      tag_seq:
        description: 'Tag sequence N in 7.2.11-kleinia.N (default: run number)'
        required: false
        default: ''
      build_jobs:
        description: 'Parallel compile jobs (default: nproc)'
        required: false
        default: ''
  push:
    branches: ['main']
    paths: ['kleinia/**', '.github/workflows/kernel-build.yml']

permissions:
  contents: read
  packages: write

env:
  ZOT_REGISTRY: ${{ vars.ZOT_REGISTRY || '127.0.0.1:5001/kleinia-os' }}
  http_proxy: ${{ vars.HTTP_PROXY || 'http://127.0.0.1:24983' }}
  https_proxy: ${{ vars.HTTP_PROXY || 'http://127.0.0.1:24983' }}
  no_proxy: localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,.invalid,.ustc.edu.cn,.aliyun.com,.tuna.tsinghua.edu.cn,.cernet.edu.cn

concurrency:
  group: kernel-build
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: [self-hosted, kln-kernel]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Preflight
        run: |
          set -euo pipefail
          echo "host=$(hostname) cores=$(nproc) mem=$(free -h | awk 'NR==2{print $2}')"
          df -h /srv/kleinia-ci /srv/kleinia-cache | sed -n '1,3p'
          for t in gcc make pahole ccache flex bison bc perl bpftool; do
            command -v "$t" >/dev/null || { echo "FATAL: $t not installed"; exit 2; }
          done
          curl -fsS "http://${ZOT_REGISTRY%%/*}/v2/" >/dev/null \
            && echo "zot: reachable" \
            || echo "zot: unreachable"
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://ghcr.io/v2/ 2>/dev/null || echo 000)
          [ "$code" -lt 500 ] && [ "$code" -ge 200 ] \
            && echo "ghcr: reachable (HTTP $code)" \
            || { echo "FATAL: ghcr unreachable (HTTP $code)"; exit 2; }

      - name: Stage signing key
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          TOOLS=/srv/kleinia-cache/kernel-tools
          mkdir -p "$TOOLS" "$GITHUB_WORKSPACE/certs"
          if [ ! -x "$TOOLS/op" ]; then
            curl -fsSL -o "$TOOLS/op.zip" \
              "https://cache.agilebits.com/dist/1P/op2/pkg/v2.41.1/op_linux_amd64_v2.41.1.zip"
            echo "e52476700cba9202ac7469bdfb2648ecdbf3438ac85822010f77230139e74966  $TOOLS/op.zip" \
              | sha256sum -c -
            python3 -m zipfile -e "$TOOLS/op.zip" "$TOOLS/op-unz"
            install -m 0755 "$TOOLS/op-unz/op" "$TOOLS/op"; rm -rf "$TOOLS/op-unz"
          fi
          timeout 180 "$TOOLS/op" document get "${KMODSIG_ITEM:-module-signing.pem}" \
            --vault KleiniaOS --force --output "$GITHUB_WORKSPACE/certs/module-signing.pem"
          pkill -f "$TOOLS/op" 2>/dev/null || true
          [ -s "$GITHUB_WORKSPACE/certs/module-signing.pem" ] \
            || { echo "FATAL: empty signing key"; exit 2; }
          chmod 600 "$GITHUB_WORKSPACE/certs/module-signing.pem"

      - name: Build kernel
        run: |
          set -euo pipefail
          if ! pgrep -x iceccd >/dev/null; then
            systemctl start iceccd 2>/dev/null || true
            sleep 3
          fi
          JOBS='${{ github.event.inputs.build_jobs }}'
          ICECC_JOBS='${{ vars.ICECC_JOBS }}'
          if pgrep -x iceccd >/dev/null && [ -n "$ICECC_JOBS" ] && [ -z "$JOBS" ]; then
            JOBS="$ICECC_JOBS"
          fi
          export KTREE="$GITHUB_WORKSPACE"
          export O=/srv/kleinia-ci/kernel-build/kbuild-7211
          export CCACHE_DIR=/srv/kleinia-cache/ccache
          mkdir -p "$O" "$CCACHE_DIR"
          bash kleinia/scripts/kbuild.sh '' "${JOBS:-$(nproc)}"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          export KTREE="$GITHUB_WORKSPACE"
          export O=/srv/kleinia-ci/kernel-build/kbuild-7211
          export STAGE=/srv/kleinia-ci/kernel-build/kartifact-stage
          export KARTIFACT_STAGE_ONLY=1
          bash kleinia/scripts/kartifact.sh

      - name: Build images
        run: |
          set -euo pipefail
          ROOT=/srv/kleinia-ci/kernel-build
          KVER=$(sed -n 's/#define UTS_RELEASE "\(.*\)"/\1/p' \
                   "$ROOT/kbuild-7211/include/generated/utsrelease.h")
          [ -n "$KVER" ] || { echo "FATAL: no KVER"; exit 2; }
          KVER="${KVER//+/}"
          KVER="${KVER//[^a-zA-Z0-9._-]/}"
          echo "KVER=$KVER"
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for img in kleinia-kernel kleinia-kernel-devel; do
            dir="$ROOT/kartifact-stage"
            [ "$img" = kleinia-kernel-devel ] && dir="$ROOT/kartifact-stage-devel"
            echo "building $img..."
            du -sh "$dir" | awk '{print "  input: "$1}'
            podman build -q -t "localhost/$img:$KVER" \
              --label "org.opencontainers.image.version=$KVER" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.created=$CREATED" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "$dir"
          done
          echo "images built"

      - name: Publish to zot
        env:
          ZOT_USER: ${{ secrets.ZOT_DEV_USER }}
          ZOT_PASSWORD: ${{ secrets.ZOT_DEV_PASSWORD }}
        run: |
          set -euo pipefail
          SEQ='${{ github.event.inputs.tag_seq }}'
          SEQ="${SEQ:-$GITHUB_RUN_NUMBER}"
          KVER="${KVER:?no KVER}"
          ROOT=/srv/kleinia-ci/kernel-build
          AUTH=$ROOT/podman-auth.json
          ZH="${ZOT_REGISTRY%%/*}"; ZP="${ZOT_REGISTRY#*/}"
          if [ -z "${ZOT_USER:-}" ] || [ -z "${ZOT_PASSWORD:-}" ]; then
            echo "no zot credentials — skipping internal publish"
            exit 0
          fi
          echo "$ZOT_PASSWORD" | podman login --authfile "$AUTH" \
            "$ZH" -u "$ZOT_USER" --password-stdin --tls-verify=false
          for img in kleinia-kernel kleinia-kernel-devel; do
            for t in "$KVER" "$KVER.$SEQ"; do
              podman push --authfile "$AUTH" --tls-verify=false \
                "localhost/$img:$KVER" "$ZH/$ZP/$img:$t"
              curl -fsS "http://$ZH/v2/$ZP/$img/manifests/$t" -o /dev/null \
                && echo "zot: $img:$t OK"
            done
          done
          echo "SEQ=$SEQ" >> "$GITHUB_ENV"

      - name: Publish to ghcr
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SEQ='${{ github.event.inputs.tag_seq }}'
          SEQ="${SEQ:-$GITHUB_RUN_NUMBER}"
          KVER="${KVER:?no KVER}"
          ROOT=/srv/kleinia-ci/kernel-build
          AUTH=$ROOT/podman-auth.json
          NS="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GHCR_TOKEN" | podman login --authfile "$AUTH" ghcr.io \
            -u "$NS" --password-stdin
          for img in kleinia-kernel kleinia-kernel-devel; do
            for t in "$KVER" "$KVER.$SEQ"; do
              podman push --authfile "$AUTH" \
                "localhost/$img:$KVER" "ghcr.io/$NS/$img:$t"
              echo "ghcr: $img:$t OK"
            done
          done
          echo "SEQ=$SEQ" >> "$GITHUB_ENV"

      - name: Sign artifacts
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          KVER="${KVER:?}"
          SEQ="${SEQ:-$GITHUB_RUN_NUMBER}"
          TAG="$KVER.$SEQ"
          NS="${GITHUB_REPOSITORY_OWNER,,}"
          TOOLS=/srv/kleinia-cache/kernel-tools
          if ! command -v cosign >/dev/null && [ ! -x "$TOOLS/cosign" ]; then
            curl -fsSL -o "$TOOLS/cosign" \
              "https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64"
            chmod 0755 "$TOOLS/cosign"
          fi
          "$TOOLS/cosign" version 2>/dev/null | head -1 || { echo "FATAL: cosign not working"; exit 2; }
          COSIGN="${TOOLS}/cosign"; command -v cosign >/dev/null && COSIGN=cosign
          timeout 180 "$TOOLS/op" document get cosign.key \
            --vault KleiniaOS --force --output /tmp/cosign.key
          pkill -f "$TOOLS/op" 2>/dev/null || true
          export COSIGN_PASSWORD
          COSIGN_PASSWORD=$(timeout 180 "$TOOLS/op" item get 'cosign key passphrase' \
            --vault KleiniaOS --format json \
            | python3 -c 'import json,sys; print(next(f["value"] for f in json.load(sys.stdin)["fields"] if f.get("id")=="password" or f.get("label","").lower()=="password"))')
          [ -n "$COSIGN_PASSWORD" ] || { echo "FATAL: empty key passphrase"; exit 2; }
          export DOCKER_CONFIG=/tmp/cosign-docker
          mkdir -p "$DOCKER_CONFIG"
          cp /srv/kleinia-ci/kernel-build/podman-auth.json "$DOCKER_CONFIG/config.json"
          ZH="${ZOT_REGISTRY%%/*}"; ZP="${ZOT_REGISTRY#*/}"
          for img in kleinia-kernel kleinia-kernel-devel; do
            "$COSIGN" sign --key /tmp/cosign.key --yes "ghcr.io/$NS/$img:$TAG"
            "$COSIGN" sign --key /tmp/cosign.key --yes "$ZH/$ZP/$img:$TAG" 2>/dev/null || true
          done
          rm -f /tmp/cosign.key
          echo "signed $TAG"

      - name: Summary
        if: always()
        run: |
          {
            echo "## kernel-build"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Run: \`#$GITHUB_RUN_NUMBER\`"
            echo "- Images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kleinia-kernel{,-devel}:${KVER:-?}.${SEQ:-?}\`"
            echo "- Cores: $(nproc)"
          } >> "$GITHUB_STEP_SUMMARY" || true
